# Corre los tests y construye el AppImage en Ubuntu 22.04 (glibc vieja = compatible con casi cualquier distro).
# Con una etiqueta vX.Y.Z además publica el AppImage en una versión (release).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # solo para publicar la versión cuando hay etiqueta
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Qt sin pantalla y herramientas)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - uses: astral-sh/setup-uv@v5

      - name: Entorno y tests
        run: |
          uv venv -q --python 3.13 .venv
          uv pip install -q --python .venv/bin/python pyrage PySide6-Essentials pytest
          .venv/bin/python -m pytest -q

      - name: appimagetool
        run: |
          mkdir -p build
          curl -fsSL -o build/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/appimagetool-x86_64.AppImage

      - name: Construir el AppImage
        run: ./packaging/build-appimage.sh

      - name: Probar que arranca
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen DECRIPT_DEST="$RUNNER_TEMP/out" timeout 10 dist/decript-*-x86_64.AppImage --appimage-extract-and-run
          code=$?
          echo "exit=$code"
          test "$code" -eq 124   # 124 = seguía abierta cuando la cortó timeout

      - name: Suma de verificación
        run: cd dist && sha256sum decript-*-x86_64.AppImage | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: decript-AppImage
          path: |
            dist/decript-*-x86_64.AppImage
            dist/SHA256SUMS

      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/decript-*-x86_64.AppImage dist/SHA256SUMS --title "decript $GITHUB_REF_NAME" --generate-notes
