[project]
name = "decript"
version = "0.1.0"
description = "Decrypt and unpack age-encrypted backups (.tar.age, .tar.gz.age, .zip.age)"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["pyrage>=1.2", "PySide6-Essentials>=6.7"]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
decript = "decript.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decript"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
